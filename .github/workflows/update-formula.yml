name: Update formula

# Bumps Formula/infrapilot.rb to a published @infrapilot/cli version: it fetches
# the npm tarball, computes its sha256, rewrites the url + sha256 fields and
# commits the change to main.
#
# Run this after infrapilot.org's "Release CLI (npm)" workflow publishes a new
# version (it can also be invoked via repository_dispatch from that repo).
#
# Triggers:
#   - manual dispatch with the target version
#   - repository_dispatch (type: cli-released) with client_payload.version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to pin (e.g. 0.2.3)"
        required: true
  repository_dispatch:
    types: [cli-released]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute tarball url + sha256
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          URL="https://registry.npmjs.org/@infrapilot/cli/-/cli-${VERSION}.tgz"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o cli.tgz
          SHA="$(sha256sum cli.tgz | cut -d' ' -f1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          rm -f cli.tgz

      - name: Rewrite formula
        run: |
          FORMULA=Formula/infrapilot.rb
          sed -i -E "s#^(\\s*url\\s+).*#\\1\"${{ steps.pkg.outputs.url }}\"#" "$FORMULA"
          sed -i -E "s#^(\\s*sha256\\s+).*#\\1\"${{ steps.pkg.outputs.sha }}\"#" "$FORMULA"
          echo "----- updated formula -----"
          cat "$FORMULA"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — formula already up to date."
            exit 0
          fi
          git commit -am "chore: bump infrapilot CLI to ${{ steps.ver.outputs.version }}"
          git push
