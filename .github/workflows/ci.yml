name: CI

# Lints the formula on every PR and push. Uses the Homebrew that ships with the
# macOS runner so `brew style` matches what users get from `brew tap`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruby syntax check
        run: ruby -c Formula/infrapilot.rb
      - name: brew style
        run: brew style Formula/infrapilot.rb
